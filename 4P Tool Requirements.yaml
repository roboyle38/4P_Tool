Project status - 02Dec25

Five layers:

[ GUI layer ]           ->  main_window.MainWindow
[ Plotting layer ]      ->  plotter.plot_full_calibration
[ Reporting/Formatting] ->  reporter.*
[ Analysis layer ]      ->  analysis.run_analysis
[ Data/Math layer ]     ->  data_loader, model_4pl, helper_fnx

One-page mental picture:

User click "Load CSV"
        ↓
MainWindow.open_csv

        ↓ calls

run_analysis(filepath)
        ↓
  load_assay_csv → x_axis, y_axis, unknown_groups, calibration_groups
        ↓
  fit_4pl        → A,B,C,D
        ↓
  compute unknown concs → results, unk_rep_x/y, unk_mean_x/y
        ↓
  make calibration_stats + (LLOQ, ULOQ)
        ↓
  return everything
        ↓
MainWindow:
  - saves to self.*
  - plot_full_calibration(...)        → plot
  - unknown_table + add_unknown_status → unknown table
  - calibration_table                  → calibration table
  - params_table_builder               → params table

